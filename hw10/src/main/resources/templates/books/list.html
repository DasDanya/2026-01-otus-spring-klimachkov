<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>List of all books</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="main">
        <h1>Books</h1>
        <p><a class="btn-blue" th:href="@{/books/add}">Add a new book</a></p>
        <table>
            <thead>
            <tr>
                <th>Id</th>
                <th>Title</th>
                <th>Author</th>
                <th>Genres</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>

    <script>
        function loadBooks() {
            fetch('/api/books')
                .then(response => response.json())
                .then(books => {
                    const tbody = document.getElementById('tbody');
                    tbody.innerHTML = books.map(book => `
                        <tr>
                            <td>${book.id}</td>
                            <td>${book.title}</td>
                            <td>${book.author.fullName}</td>
                            <td>${book.genres.map(genre => genre.name).join(', ')}</td>
                            <td>
                                <a class="btn-blue" href="/books/${book.id}/commentaries">Commentaries</a>
                                <a class="btn-blue" href="/books/${book.id}">View</a>
                                <a class="btn-blue" href="/books/${book.id}/edit">Edit</a>
                                <a class="btn-red" onclick="deleteBook(${book.id})">Delete</a>
                            </td>
                        </tr>
                    `).join('');
                });
        }

        function deleteBook(id) {
            if (confirm('Are you sure you want to delete this book?')) {
                fetch(`/api/books/${id}`, {method: 'DELETE'}).then(() => loadBooks())
            }
        }

        loadBooks();
    </script>
</body>
</html>
