<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>List of all commentaries</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="main">
        <h1>Commentaries</h1>
        <p>
            <a class="btn-blue" th:href="@{/books/{bookId}/commentaries/add(bookId=${bookId})}">Add a new commentary</a>
        </p>
        <table>
            <thead>
            <tr>
                <th>Id</th>
                <th>Text</th>
                <th>Book</th>
                <th>Author</th>
                <th>Genres</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="commentary : ${commentaries}">
                <td th:text="${commentary.id}"/>
                <td th:text="${commentary.text}"/>
                <td th:text="${commentary.book.title}"/>
                <td th:text="${commentary.book.author.fullName}"/>
                <td>
                    <span th:each="genre, iterStat : *{commentary.book.genres}">
                        <span th:text="${genre.name}"/>
                        <span th:if="${!iterStat.last}">,</span>
                    </span>
                </td>
                <td>
                    <span>
                        <a class="btn-blue"
                           th:href="@{/books/{bookId}/commentaries/{id}(bookId=${bookId}, id=${commentary.id})}">View
                        </a>
                    </span>
                    <span sec:authorize="hasAuthority('ADMIN')"><a class="btn-blue"
                             th:href="@{/books/{bookId}/commentaries/{id}/edit(bookId=${bookId}, id=${commentary.id})}">Edit
                    </a></span>
                    <form class="inline-form"
                          th:action="@{/books/{bookId}/commentaries/{id}/delete(bookId=${bookId}, id=${commentary.id})}"
                          th:method="post"
                          onsubmit="return confirm('Are you sure you want to delete this commentary?');">
                        <span sec:authorize="hasAuthority('ADMIN')">
                            <button class="btn-red" type="submit">Delete</button>
                        </span>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
