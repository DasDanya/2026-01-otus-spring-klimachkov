<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>List of all books</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="main">
        <h1>Books</h1>
        <p sec:authorize="hasAuthority('ADMIN')"><a class="btn-blue" th:href="@{/books/add}">Add a new book</a></p>
        <table>
            <thead>
            <tr>
                <th>Id</th>
                <th>Title</th>
                <th>Author</th>
                <th>Genres</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.id}"/>
                <td th:text="${book.title}"/>
                <td th:text="${book.author.fullName}"/>
                <td>
                    <span th:each="genre, iterStat : ${book.genres}">
                        <span th:text="${genre.name}"/>
                        <span th:if="${!iterStat.last}">,</span>
                    </span>
                </td>
                <td>
                    <span>
                        <a class="btn-blue" th:href="@{/books/{bookId}/commentaries(bookId=${book.id})}">Commentaries</a>
                    </span>
                    <span><a class="btn-blue" th:href="@{/books/{id}(id=${book.id})}">View</a></span>
                    <span sec:authorize="hasAuthority('ADMIN')">
                        <a class="btn-blue" th:href="@{/books/{id}/edit(id=${book.id})}">Edit</a>
                    </span>
                    <form class="inline-form" th:action="@{/books/{id}/delete(id=${book.id})}" th:method="post"
                          onsubmit="return confirm('Are you sure you want to delete this book?');">
                        <span sec:authorize="hasAuthority('ADMIN')">
                            <button class="btn-red" type="submit">Delete</button>
                        </span>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
