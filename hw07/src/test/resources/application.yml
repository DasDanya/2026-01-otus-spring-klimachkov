spring:
  application:
    name: Homework 07
    version: 1.0
  datasource:
    url: jdbc:h2:mem:testdb
  sql:
    init:
      mode: always
      schema-locations: schema.sql
      data-locations: ""
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true